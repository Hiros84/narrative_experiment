<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>データ分析ページ</title>
    <style>
        body { font-family: sans-serif; }
        h1, h2 { text-align: center; }
        .page-section { width: 95%; margin-left: auto; margin-right: auto; margin-bottom: 20px; }
        #table-container { height: 800px; overflow-y: scroll; border: 1px solid #ccc; }
        #visuals-container { display: flex; justify-content: space-around; gap: 20px; }
        #histogram-section, #crosstab-section { width: 48%; border: 1px solid #eee; padding: 10px; border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 6px; font-size: 12px; text-align: center;}
        thead th { background-color: #f2f2f2; position: sticky; top: 0; }
        select, input[type="number"], input[type="text"] { margin: 5px; padding: 5px; font-size: 16px; }
        .controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px;}
        #scale-specification-container { border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #f9f9f9; }
        #scale-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 10px; border: 1px solid #eee; background: #fff; }
        .scale-item { border: 1px solid #ddd; padding: 10px; border-radius: 4px; }
        .scale-item-header { font-weight: bold; margin-bottom: 5px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .scale-item-header label { font-size: 12px; font-weight: normal; }
        .scale-item-radios div { display: block; margin-bottom: 3px; }
        .scale-item-radios label { margin-left: 5px; font-size: 13px; }
        #apply-scales-button { display: block; width: 100%; padding: 10px; font-size: 16px; margin-top: 15px; }
        #filter-container { padding: 10px; background-color: #f0f8ff; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>データ分析</h1>

    <div id="scale-specification-container" class="page-section">
        <h2>変数の尺度指定</h2>
        <div id="scale-grid"></div>
        <button id="apply-scales-button">反映</button>
    </div>

    <div id="filter-container" class="page-section">
        <div class="controls">
            <span>テーブルフィルター:</span>
            <select id="filter-column-selector"></select>
            <span>が</span>
            <input type="text" id="filter-value-input" placeholder="この値と一致">
            <span>の行を表示</span>
            <button id="filter-apply-button">適用</button>
            <button id="filter-reset-button">リセット</button>
            <span style="border-left: 1px solid #ccc; margin: 0 10px;"></span>
            <button id="deselect-all-button">全選択解除</button>
            <button id="save-selection-button">選択保存</button>
        </div>
    </div>

    <div id="table-container" class="page-section">
        <h2>データテーブル</h2>
    </div>

    <div id="visuals-container" class="page-section">
        <div id="histogram-section">
            <h2>ヒストグラム</h2>
            <select id="histogram-selector"></select>
            <div id="histogram-container"></div>
        </div>
        <div id="crosstab-section">
            <h2>クロス集計</h2>
            <div class="controls">
                <span>行:</span> <select id="crosstab-row-selector"></select>
                <span>列:</span> <select id="crosstab-col-selector"></select>
            </div>
            <div id="crosstab-container"></div>
        </div>
    </div>

    <div id="cluster-analysis-container" class="page-section">
        <hr>
        <h2>クラスター分析</h2>
        <div class="controls">
            <label for="n-clusters-input">クラスター数:</label>
            <input type="number" id="n-clusters-input" value="5" min="2" style="width: 60px;">
            <button id="run-spectral-button">Spectral Clustering実行</button>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/analysis.js"></script>
</body>
</html>
