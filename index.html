<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>商品マップ検討</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body {
      height: 100%;
    }
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f8f8f8;
    }
    #canvas-container {
      width: 100%;
      height: 87%;
      max-width: 2040px;
      max-height: 1500px;
      margin: 20px auto;
      overflow: auto;
      border: 1px solid lightgray;
      border-radius: 8px;
      background-color: #f4f8fb;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .divider {
      width: 2px;
      height: 36px;
      background-color: #ccc;
    }
  </style>
</head>
<body>

  <h1>商品マップ検討　2回目修正したあとです</h1>
  <div id="toolbar" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
    <!-- 新規追加: テキスト入力とボタン -->
    <input type="text" id="text-node-input" placeholder="テキストを入力" style="padding:4px; font-size:14px; width:160px;" />
    <button id="add-text-btn">テキスト追加</button>
    <!-- 楕円追加-->
    <label for="ellipse-color" style="font-size: 14px; color: gray;">色：</label>
    <input type="color" id="ellipse-color" value="#ff6b6b" style="width: 40px; height: 28px; padding: 0; border: 1px solid #ccc; border-radius: 4px;">
    <label for="line-style" style="font-size: 14px; color: gray;">線：</label>
    <select id="line-style">
      <option value="solid">実線</option>
      <option value="dashed">点線</option>
    </select>
    <button id="add-ellipse-btn" title="キャンバスに楕円を追加">楕円追加</button>
    
    <span class="divider"></span>
    <!-- 新規追加: 削除・復活・最背面ボタン -->
    <button id="delete-node-btn" title="選択ノードを削除">削除</button>
    <button id="restore-node-btn" title="直前の削除を取り消す">復活</button>
    <button id="send-to-back-btn" title="選択ノードを最背面に移動">最背面</button>

    <span class="divider"></span>
    <label for="json-file-list" style="font-size: 14px; color: gray;">保存済みファイル：</label>
    <select id="json-file-list"></select>
    <button id="load-btn">読込</button>
    <input type="text" id="filename-input" placeholder="保存ファイル名（.json不要）" style="margin-left: 20px;">
    <button id="save-btn">保存</button>
  </div>

  <div id="canvas-container">
    <svg id="mysvg" width="2000" height="1480" style="display: block;">
      <g class="viewport">
        <g class="link-layer"></g>
        <g class="zoom-layer"></g>
      </g>
    </svg>
  </div>

  <!-- 新しいズーム制御スクリプト -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const svg = d3.select("#mysvg");
    const zoomLayer = svg.select("g.zoom-layer");

    // --- ズーム定義 ---
    const zoom = d3.zoom()
      .scaleExtent([0.5, 3])
      .on("zoom", (event) => {
        zoomLayer.attr("transform", event.transform);
      });

    svg.call(zoom);

    // --- ズームを後から main.js 側で制御できるように公開 ---
    window.svg = svg;
    window.zoom = zoom;
    window.zoomLayer = zoomLayer;

    // --- main.js 側でデータ読込完了後に呼ぶ用の関数 ---
    window.resetZoomToFit = function(bounds) {
      if (!bounds || !bounds.width || !bounds.height) return;

      const svgWidth = +svg.attr("width");
      const svgHeight = +svg.attr("height");

      const scale = Math.min(svgWidth / bounds.width, svgHeight / bounds.height) * 0.9;
      const translate = [
        (svgWidth - bounds.width * scale) / 2 - bounds.x * scale,
        (svgHeight - bounds.height * scale) / 2 - bounds.y * scale
      ];

      svg.transition()
        .duration(500)
        .call(zoom.transform,
              d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
    };
  });
  </script>
  
  <script src="/js/main.js"></script>

</body>
</html>
